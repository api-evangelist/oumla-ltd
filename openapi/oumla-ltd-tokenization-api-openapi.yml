openapi: 3.0.0
info:
  title: Oumla Core Server addresses tokenization API
  description: 'Core API. Errors, request and response are documented per endpoint. Error response shape: code, category, message, statusCode, path, timestamp, requestId.'
  version: '1.0'
  contact: {}
servers:
- url: https://sandbox.oumla.com
  description: Mainnet
  x-fern-server-name: Mainnet
tags:
- name: tokenization
paths:
  /api/v1/tokenization/tokens:
    post:
      description: Start the issue-token workflow. Returns the workflowId, tokenId, and status.
      operationId: issueNewToken
      parameters:
      - $ref: '#/components/parameters/SdkVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueNewTokenRequestBody'
      responses:
        '202':
          description: Issue token workflow started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTokenWorkflowResponseDto'
        '400':
          description: 'Bad request or validation failed.


            **Applicable error codes and client messages**


            The response body contains one of the following error codes and the corresponding client-facing message.


            | Code | Client message |

            |------|----------------|

            | ERR-010 | The request could not be processed. |

            | ERR-310 | Contract does not have a valid ABI. |

            | ERR-311 | Contract initialize function not found. |

            | ERR-312 | Required initialization parameters are missing. |

            | ERR-313 | Parameter types do not match the expected types. |

            | ERR-146 | Contract deployment is still in progress. |'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiErrorResponseDto'
                properties:
                  code:
                    type: string
                    enum:
                    - ERR_010
                    - ERR_310
                    - ERR_311
                    - ERR_312
                    - ERR_313
                    - ERR_146
                    description: 'One of: ERR-010: The request could not be processed.; ERR-310: Contract does not have a valid ABI.; ERR-311: Contract initialize function not found.; ERR-312: Required initialization parameters are missing.; ERR-313: Parameter types do not match the expected types.; ERR-146: Contract deployment is still in progress.'
                  message:
                    type: string
                    description: Client-facing message for this error code (see table above).
                example:
                  code: ERR_010
                  message: The request could not be processed.
                  category: VALIDATION
                  statusCode: 400
                  path: /api/v1/example
                  timestamp: '2025-02-20T12:00:00.000Z'
                  requestId: req-example-id
        '401':
          description: 'Unauthorized – invalid or missing token.


            **Applicable error codes and client messages**


            The response body contains one of the following error codes and the corresponding client-facing message.


            | Code | Client message |

            |------|----------------|

            | ERR-008 | You need to sign in to continue. |

            | ERR-011 | Your session is invalid or expired. Please sign in again. |'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiErrorResponseDto'
                properties:
                  code:
                    type: string
                    enum:
                    - ERR_008
                    - ERR_011
                    description: 'One of: ERR-008: You need to sign in to continue.; ERR-011: Your session is invalid or expired. Please sign in again.'
                  message:
