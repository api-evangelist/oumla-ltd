components:
  schemas:
    ContractFunDto:
      type: object
      properties:
        name:
          type: string
        stateMutability:
          allOf:
          - $ref: '#/components/schemas/ContractTemplateFunctionVisibilityType'
        type:
          allOf:
          - $ref: '#/components/schemas/ContractTemplateFunctionType'
        inputs:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/InputOutputDto'
        outputs:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/InputOutputDto'
        description:
          type: string
        anonymous:
          type: boolean
      required:
      - type
      - inputs
    ReadCallResultDataDto:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ReadCallDataDto'
        success:
          type: boolean
        status:
          type: number
    WriteCallFunctionBody:
      type: object
      properties:
        addressId:
          type: string
        clientShare:
          type: string
        abiFunction:
          $ref: '#/components/schemas/ContractFunDto'
        amount:
          type: string
        feeLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
      required:
      - addressId
      - clientShare
      - abiFunction
    ApiErrorResponseDto:
      type: object
      properties:
        message:
          type: string
          description: Human-readable error message for the client (see ErrorClientMessage per code)
