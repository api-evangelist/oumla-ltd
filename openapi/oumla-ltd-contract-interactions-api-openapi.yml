                  code:
                    type: string
                    enum:
                    - ERR_006
                    - ERR_066
                    description: 'One of: ERR-006: The requested resource was not found.; ERR-066: Contract not found.'
                  message:
                    type: string
                    description: Client-facing message for this error code (see table above).
                example:
                  code: ERR_006
