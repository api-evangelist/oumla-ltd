aid: oumla-ltd
name: Oumla Ltd
description: >-
  Oumla is a Saudi-based provider of enterprise-grade digital asset infrastructure for
  regulated institutions. Its Core API delivers MPC-based wallet and address management,
  portfolio and native-balance queries, on-chain transaction tracking, smart-contract
  templates plus deployment and read/write interactions, and tokenization (collections,
  issue, mint, burn) for tokenized securities, fund units, sukuk, and NFTs. Products span
  Digital Assets Infrastructure (custody, policy engines, lifecycle), Capital Markets
  Tokenization, the Oumla Financial Chain for Shariah-compliant interbank settlement, and
  Bahith blockchain monitoring and compliance analytics built for Saudi data sovereignty.
  Authentication is via the x-api-key header; long-running mutations run as async workflows.
  Oumla is SOC 2 Type II and ISO 27001 certified.
